<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen MC Platform - Node Initialization Wizard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617); min-height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="text-slate-100 flex items-center justify-center p-4">
    <div class="glass max-w-xl w-full rounded-2xl p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-indigo-600/30 border border-indigo-500/30 text-indigo-400 mb-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">NextGen MC Hosting Setup Wizard</h1>
            <p class="text-xs text-slate-400">클러스터 노드 역할 및 초기 인프라 구성을 완료하십시오.</p>
        </div>

        <form id="setupForm" class="space-y-5">
            <!-- Node Role Selection -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">노드 역할 (Node Role)</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="cursor-pointer border border-slate-700 bg-slate-800/60 rounded-xl p-4 flex flex-col items-center justify-center space-y-2 transition-all duration-200 hover:border-indigo-500 peer-checked:border-indigo-500 peer-checked:bg-indigo-950/40">
                        <input type="radio" name="node_role" value="master" class="hidden" checked onchange="handleRoleChange('master')">
                        <span class="font-bold text-sm text-indigo-300">Master Node (대장)</span>
                        <span class="text-[11px] text-slate-400 text-center">API 서버, 과금 엔진, 대시보드, 노드 스케줄러</span>
                    </label>
                    <label class="cursor-pointer border border-slate-700 bg-slate-800/60 rounded-xl p-4 flex flex-col items-center justify-center space-y-2 transition-all duration-200 hover:border-indigo-500">
                        <input type="radio" name="node_role" value="worker" class="hidden" onchange="handleRoleChange('worker')">
                        <span class="font-bold text-sm text-slate-300">Worker Node (작업)</span>
                        <span class="text-[11px] text-slate-400 text-center">도커 격리 컨테이너 구동, ZRAM 다층 메모리</span>
                    </label>
                </div>
            </div>

            <!-- Common Fields -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">노드 명칭 (Node Name)</label>
                    <input type="text" id="node_name" name="node_name" required placeholder="예: seoul-worker-01" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">노드 고유 식별자 (Node UUID)</label>
                    <input type="text" id="node_id" name="node_id" readonly class="w-full px-3.5 py-2.5 rounded-lg bg-slate-950/80 border border-slate-800 text-xs font-mono text-slate-400 focus:outline-none">
                </div>
            </div>

            <!-- Worker-Specific Fields (Hidden by default) -->
            <div id="workerFields" class="space-y-3 hidden border-t border-slate-800 pt-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Master 노드 API 주소</label>
                    <input type="text" id="master_endpoint" name="master_endpoint" placeholder="http://192.168.1.100:8000" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">클러스터 보안 인증 토큰 (Cluster Secret)</label>
                    <input type="password" id="cluster_token" name="cluster_token" placeholder="클러스터 공통 시크릿 키 입력" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">하드웨어 스펙 티어 (차등 과금 배율)</label>
                    <select id="hardware_tier" name="hardware_tier" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="standard_ssd">표준 SSD 노드 (1.0x 배율)</option>
                        <option value="high_nvme">고성능 Gen4 NVMe 노드 (1.3x 배율)</option>
                        <option value="extreme_dedicated">최고성능 단독 코어 노드 (1.8x 배율)</option>
                    </select>
                </div>
            </div>

            <!-- Master-Specific Fields -->
            <div id="masterFields" class="space-y-3 border-t border-slate-800 pt-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">관리자 이메일 (SuperAdmin Email)</label>
                    <input type="email" id="admin_email" name="admin_email" placeholder="admin@domain.com" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">클러스터 마스터 시크릿 키</label>
                    <input type="password" id="master_secret" name="master_secret" required placeholder="클러스터 암호화 키" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-sm focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm shadow-lg shadow-indigo-600/30 transition duration-150 ease-in-out">
                설정 완료 및 백그라운드 서비스 시작
            </button>
        </form>

        <div id="statusBox" class="hidden p-4 rounded-xl text-center text-xs space-y-2"></div>
    </div>

    <script>
        function uuidv4() {
            return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
                (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
            );
        }
        document.getElementById('node_id').value = 'node-' + uuidv4().substring(0, 13);
        document.getElementById('node_name').value = 'node-' + Math.floor(1000 + Math.random() * 9000);

        function handleRoleChange(role) {
            const masterFields = document.getElementById('masterFields');
            const workerFields = document.getElementById('workerFields');
            if (role === 'master') {
                masterFields.classList.remove('hidden');
                workerFields.classList.add('hidden');
            } else {
                masterFields.classList.add('hidden');
                workerFields.classList.remove('hidden');
            }
        }

        document.getElementById('setupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusBox');
            btn.disabled = true;
            btn.innerText = '인프라 설정 적용 및 서비스 등록 중...';

            const formData = new FormData(e.target);
            const payload = Object.fromEntries(formData.entries());

            try {
                const resp = await fetch('/api/setup/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await resp.json();
                if (resp.ok) {
                    statusBox.className = 'p-4 rounded-xl bg-emerald-950/60 border border-emerald-500/40 text-emerald-300 text-center text-xs';
                    statusBox.innerHTML = `<strong>성공!</strong> ${result.message}<br>잠시 후 임시 웹 서버가 종료되고 서비스가 시작됩니다.`;
                    statusBox.classList.remove('hidden');
                } else {
                    throw new Error(result.error || '설정 처리 중 오류가 발생했습니다.');
                }
            } catch (err) {
                statusBox.className = 'p-4 rounded-xl bg-rose-950/60 border border-rose-500/40 text-rose-300 text-center text-xs';
                statusBox.innerHTML = `<strong>오류 발생:</strong> ${err.message}`;
                statusBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = '다시 시도';
            }
        });
    </script>
</body>
</html>
